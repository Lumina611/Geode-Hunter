<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../prototype/"><title>晶洞材质与模型 · 参考建模工作样</title><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>
*{box-sizing:border-box}body{background:#17130f;color:#e5d9c9;margin:0;padding:32px 5%;font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}h1{font:400 30px Georgia,serif;margin:5px 0}p{color:#b6a48e}button,a{font:inherit;color:inherit}button{background:#2c2420;border:1px solid #5e4f40;padding:10px 18px;cursor:pointer;border-radius:4px}button[aria-pressed=true]{background:#50413a}button:disabled{opacity:.4}.workspace{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:20px}.viewer{background:#1c1712;border:1px solid #3c3024;border-radius:8px;overflow:hidden}#stage{width:100%;height:490px;touch-action:none}#stage canvas{width:100%;height:100%;display:block}.caption{padding:0 20px}#reference{width:100%;aspect-ratio:1;object-fit:contain;background:#000}aside h2{font-size:17px;font-weight:400}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}#catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}#catalog img{width:100%;aspect-ratio:1.5;object-fit:contain}#catalog button{padding:4px 10px;background:#221b16;border-color:#3b3027}small{color:#9e8d79}.eyebrow{letter-spacing:2px;font-size:11px}#assetStatus{min-height:25px;font-size:12px}#error{color:#eead96}@media(max-width:700px){.workspace{grid-template-columns:1fr}#stage{height:370px}aside{display:none}#catalog{grid-template-columns:1fr 1fr}body{padding:22px 4%}}</style></head><body>
<p class="eyebrow">GEODE HUNTER / ORIGINAL 3D ASSET STUDIES</p><h1>矿物晶形与覆盖密度 · 12 类三维工作样</h1><p>开发验收页 · 不读取或改写游戏进度。模型、背面与内部深度为程序重建，非扫描；未达到摄影级。<a href="./">返回小游戏</a></p>
<div class="workspace"><section class="viewer"><div id="stage" tabindex="0" aria-label="三维模型，可拖动旋转、滚轮缩放，点击石头敲击"></div><div class="caption"><strong id="modelName"></strong> <span id="viewStatus"></span><p id="assetStatus"></p><p id="error" hidden></p></div></section><aside><h2>AI 晶形方向参考 · 非实际渲染</h2><img id="reference" alt="建模使用的二维 AI 美术候选图"><p>只参考轮廓、色调与晶体形态；贴图由数学噪声制作，未将这张图片贴在平面上冒充三维。</p></aside></div>
<div class="controls"><button id="reset">恢复完整原石</button><button id="hit">敲击 1 / 4</button><button id="reveal">查看打开后的双半壳</button><button id="sound" aria-pressed="false">声音：关</button><button id="rotate">自动旋转：关</button></div><p id="status" role="status"></p><div id="catalog"></div>
<script type="module">
import C from './config.js';import './v03-vocabulary.js?v=mineral-density-4';import './app.js?v=mineral-density-4';import {StoneSound} from './sound.js';
const view=window.GeodeView,$=s=>document.querySelector(s),types=C.types.filter(t=>t.art.modelStatus==='reference-study'),sound=new StoneSound();sound.enabled=false;if(new URLSearchParams(location.search).has('missing'))types[0].art.modelUrl='assets/models/intentional-missing-demo.glb';let current=types[0],hits=0,loading=false,auto=false,epoch=0;
function status(){document.body.dataset.hits=String(hits);$('#status').textContent=loading?'正在载入配对 GLB…':hits===4?'已揭晓 · 两半外壳来自同一模型，可继续拖动、缩放。':`完整石壳 / 已敲击 ${hits} 次 · 点击石头本身也能敲击`;$('#hit').disabled=loading||hits===4;$('#hit').textContent=hits===4?'四击完成':`敲击 ${hits+1} / 4`;}
async function choose(type){const ticket=++epoch;loading=true;current=type;hits=0;$('#modelName').textContent=type.name;$('#reference').src=type.art.detailImage;document.body.dataset.selected=type.id;status();await view.load({type:type.id,seed:1487,shell:'chalk',phase:'intact'},true);if(ticket!==epoch)return;loading=false;status();}
function strike(){if(loading||hits===4)return;hits++;view.strike(hits);sound.strike(hits);if(hits===4)view.reveal();status();}
$('#stage').addEventListener('stone-tap',strike);$('#hit').onclick=strike;$('#reset').onclick=()=>choose(current);$('#reveal').onclick=()=>{if(loading)return;hits=4;view.reveal();status();};$('#sound').onclick=()=>{sound.enabled=!sound.enabled;$('#sound').textContent='声音：'+(sound.enabled?'开':'关');$('#sound').setAttribute('aria-pressed',String(sound.enabled));};$('#rotate').onclick=()=>{auto=!auto;view.setAuto(auto);$('#rotate').textContent='自动旋转：'+(auto?'开':'关');};
await choose(types[0]);for(const type of types){const button=document.createElement('button'),image=document.createElement('img'),label=document.createElement('span');image.alt=type.name+(type.art.modelUrl.includes('intentional-missing')?'回退程序模型渲染':'实际 GLB 三维渲染');image.src=await view.assetThumbnail(type.id);label.textContent=type.number+' '+type.name;button.append(image,label);button.dataset.type=type.id;button.onclick=()=>choose(type);$('#catalog').append(button);}document.body.dataset.rendered=String(types.length);
</script></body></html>
