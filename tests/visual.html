<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V0.3 · 14 种程序标本开发验收</title><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"../prototype/vendor/three.module.js"}}</script><style>body{margin:0;background:#17130f;color:#ded2be;font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:40px 5%}h1{font-size:28px;font-weight:400}p{color:#b2a189}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}article{border-bottom:1px solid #403427;padding-bottom:15px}img{width:100%;aspect-ratio:1.5;object-fit:contain}h2{font-size:14px;font-weight:400;margin:4px 0}small{color:#a79478}#stage{position:fixed;left:-10000px;top:0;width:800px;height:600px}#viewStatus,#assetStatus{display:none}#error{color:#eab9a3}@media(max-width:700px){main{grid-template-columns:1fr 1fr}}</style></head><body><p>DEVELOPMENT QA / 不读取或改写游戏存档</p><h1>14 种形态 · 程序 3D 占位验收</h1><p>本页展示各自独立生成的 3D 形态，不是正式摄影素材，也不代表玩家已经解锁。</p><main id="specimens"></main><div id="stage"></div><p id="viewStatus"></p><p id="assetStatus"></p><p id="error" hidden></p><script type="module">import C from '../prototype/config.js';import '../prototype/app.js';const root=document.querySelector('#specimens');for(const type of C.types){const article=document.createElement('article'),image=document.createElement('img'),title=document.createElement('h2'),note=document.createElement('small');image.src=window.GeodeView.catalogThumbnail(type.id,1487+Number(type.number)*13);image.alt=type.name;title.textContent=type.number+' '+type.name;note.textContent=type.habit.zh+(type.fantasy?' · 幻想':'');article.dataset.type=type.id;article.append(image,title,note);root.append(article);await new Promise(resolve=>requestAnimationFrame(resolve));}document.querySelector('#stage').hidden=true;document.body.dataset.rendered=String(C.types.length);</script></body></html>
